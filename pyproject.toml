[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basketball-detect-mvp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "opencv-python>=4.8", "Pillow>=10", "ultralytics>=8.4,<9", "dill>=0.4.1,<0.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["basketball_detect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
