[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basketball-highlight-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "pydantic>=2.9,<3", "langgraph>=0.2,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
detection = ["numpy>=1.26", "opencv-python>=4.8", "Pillow>=10", "ultralytics>=8.3.225,<9", "dill>=0.4.1,<0.5"]
dev = ["pytest>=8"]

[project.scripts]
basketball-detect = "basketball_detect.__main__:main"

[tool.setuptools.packages.find]
include = ["contracts*", "backend*", "agent*", "video_engine*", "basketball_detect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
